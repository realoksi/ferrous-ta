[package]
name = "ferrous-ta"
version = "0.1.0"
edition = "2024"
description = "a technical-analysis library written in rust "
repository = "https://github.com/realoksi/ferrous-ta"
license = "MIT"
keywords = ["technical-analysis", "statistics", "finance"]
categories = ["finance", "mathematics", "embedded"]
exclude = [".github/*"]

[dev-dependencies]
serde = { version = "1.0.228", features = ["derive"]}
rust_decimal = { version = "1.40.0", default-features = false, features = ["macros", "maths", "serde-with-str"] }
csv = { version = "1.4.0" }